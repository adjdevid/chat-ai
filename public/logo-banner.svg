<svg viewBox="0 0 650 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="650" height="160" rx="16" fill="#000000"/>
  
  <!-- Monogram AD (Left side) -->
  <g transform="translate(15, 10) scale(0.85)">
    <path d="M 90 28 L 22 144" stroke="#0075FF" stroke-width="16" stroke-linecap="square"/>
    <path d="M 90 28 L 120 80" stroke="#0075FF" stroke-width="16" stroke-linecap="square"/>
    <path d="M 68 91 L 106 144" stroke="#0075FF" stroke-width="16" stroke-linecap="square"/>
    <path d="M 78 85 L 118 85 C 152 85 152 137 118 137 L 106 137" stroke="#FFFFFF" stroke-width="16" stroke-linecap="square" fill="none"/>
  </g>

  <!-- Title: ADJDEV -->
  <g transform="translate(200, 32)">
    <!-- A (Blue Chevron) -->
    <path d="M 22 55 L 42 12 L 62 55" stroke="#0075FF" stroke-width="10" stroke-linecap="square" fill="none"/>
    
    <!-- D (White) -->
    <path d="M 95 14 V 54 H 115 C 135 54 135 14 115 14 Z" stroke="#FFFFFF" stroke-width="10" stroke-linecap="square" fill="none"/>
    
    <!-- J (White) -->
    <path d="M 155 14 V 42 C 155 56 140 56 140 44" stroke="#FFFFFF" stroke-width="10" stroke-linecap="square" fill="none"/>
    
    <!-- D (White) -->
    <path d="M 210 14 V 54 H 230 C 250 54 250 14 230 14 Z" stroke="#FFFFFF" stroke-width="10" stroke-linecap="square" fill="none"/>
    
    <!-- E (White with Blue center bar) -->
    <path d="M 310 14 H 280 V 54 H 310" stroke="#FFFFFF" stroke-width="10" stroke-linecap="square" fill="none"/>
    <line x1="280" y1="34" x2="305" y2="34" stroke="#0075FF" stroke-width="10"/>
    
    <!-- V (White) -->
    <path d="M 340 14 L 362 54 L 384 14" stroke="#FFFFFF" stroke-width="10" stroke-linecap="square" fill="none"/>
  </g>

  <!-- Subtitle: — DEVELOP • DESIGN • DEPLOY — -->
  <g transform="translate(200, 115)">
    <!-- Left Line -->
    <line x1="0" y1="0" x2="30" y2="0" stroke="#0075FF" stroke-width="3"/>
    
    <!-- Text -->
    <text x="45" y="4" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="700" font-size="15" fill="#FFFFFF" letter-spacing="4">DEVELOP</text>
    <circle cx="160" cy="0" r="3" fill="#0075FF"/>
    <text x="180" y="4" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="700" font-size="15" fill="#FFFFFF" letter-spacing="4">DESIGN</text>
    <circle cx="282" cy="0" r="3" fill="#0075FF"/>
    <text x="302" y="4" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="700" font-size="15" fill="#FFFFFF" letter-spacing="4">DEPLOY</text>
    
    <!-- Right Line -->
    <line x1="410" y1="0" x2="440" y2="0" stroke="#0075FF" stroke-width="3"/>
  </g>
</svg>
